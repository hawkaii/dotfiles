[variables]
padding = 3

[colors]
barbackground = #00101010
background = #101010
background-alt = #191919
foreground = ${colors.white}
primary = #e0e0e0
primaryselected = #000000
primarytext = ${colors.blue}
secondary = #FF455359

; #6D7B86
white = #e0e0e0
red = #c99f9d
green = #a5c99d
yellow = #c9c19d
blue = #9db3c9
magenta = #c79dbf

alert = #FFA54242
disabled = #FF707880

[bar/example]
dpi = 98
width = 100%
height = 34
offset-x = 0
offset-y = 0

tray-detached = false

bottom = false

background = ${colors.barbackground}
foreground = ${colors.foreground}

border-bottom-size = 1
border-top-size = 1
border-left-size = 0
border-right-size = 0
line-size = 1pt

border-size = 0
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 0

separator = ""
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:style=Medium:size=12;2"
font-1 = "JetBrainsMono Nerd Font:style=Medium:size=14;3"

modules-left = name xworkspaces xwindow
modules-right = pulseaudio memory cpu backlight wlan battery tray
modules-center = date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = i3
override-redirect = false

[module/name]
type = custom/text
format = 

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-foreground = ${colors.primaryselected}
label-active-background = ${colors.magenta}
label-active-underline = ${colors.magenta}
label-active-padding = 5

label-occupied = "%name%"
label-occupied-padding = 5
label-occupied-background = ${colors.background}

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-background = ${colors.background-alt}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label =  %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#e0e0e0}%mountpoint%%{F-} %percentage_used%%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}
label-layout-background = ${colors.background}

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>
label-volume =  %percentage%%
label-volume-padding = 1

label-muted =  muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
label =  %percentage_used:2%%
label-padding = 1

[module/cpu]
type = internal/cpu
interval = 2
label =  %percentage:2%%
label-padding = 1

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#8caab8}%ifname%%{F#707880} disconnected
label-disconnected-background = ${colors.background}
label-disconnected-padding = ${variables.padding}

[module/wlan]
inherit = network-base
interface-type = wireless

label-connected =  %essid%
label-connected-padding = 1

click-left = nm-applet

[module/date]
type = internal/date
interval = 1

date = %a %H:%M
date-alt = %A %d / %m / %Y
label =  %date%
label-foreground = ${colors.background}
label-background = ${colors.blue}
label-padding = ${variables.padding}

[module/battery]
type = custom/script
exec = ~/.config/polybar/battery.sh
interval = 10

label = %output%
label-foreground = ${colors.background}
label-background = ${colors.green}
label-padding = ${variables.padding}
[module/tray]
type = internal/tray
# Set tray-padding to control the padding around the tray
tray-padding = 2

[module/backlight]
type = custom/script
exec = brightnessctl info | grep -oP '\\d+(?=%)' | awk '{printf " %s%%", $1}'
interval = 1

click-left = brightnessctl set +5%
click-right = brightnessctl set 5%-
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-
label = %output%
label-padding = 3

[settings]
screenchange-reload = true
pseudo-transparency = true

